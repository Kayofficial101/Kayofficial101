<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Keshav Kapoor</title>
  <desc id="desc">Strategy, growth, analytics and marketing operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f2e7"/>
      <stop offset="1" stop-color="#edf4f0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#19324a" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <circle cx="1070" cy="50" r="150" fill="#ef8354" opacity=".12"/>
  <circle cx="1120" cy="310" r="185" fill="#2a9d8f" opacity=".12"/>
  <g transform="translate(76 78)" font-family="Arial, sans-serif">
    <text x="0" y="0" dominant-baseline="hanging" font-size="18" font-weight="700" letter-spacing="4" fill="#2a7b70">KESHAV KAPOOR</text>
    <text x="0" y="52" dominant-baseline="hanging" font-size="46" font-weight="700" fill="#14213d">Strategy, growth and analytics</text>
    <text x="0" y="120" dominant-baseline="hanging" font-size="23" fill="#405263">I turn research into clear decisions and useful systems.</text>
    <g transform="translate(0 178)" font-size="15" font-weight="700">
      <rect width="122" height="36" rx="18" fill="#14213d"/><text x="61" y="23" text-anchor="middle" fill="#fff">ANALYSIS</text>
      <rect x="134" width="112" height="36" rx="18" fill="#2a9d8f"/><text x="190" y="23" text-anchor="middle" fill="#fff">GROWTH</text>
      <rect x="258" width="194" height="36" rx="18" fill="#ef8354"/><text x="355" y="23" text-anchor="middle" fill="#fff">MARKETING OPS</text>
    </g>
  </g>
</svg>
